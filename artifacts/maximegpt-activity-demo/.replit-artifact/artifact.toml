kind = "web"
previewPath = "/"
title = "MaximeGPT Activity"
description = "Activity Discord privée avec avatar animé, chat IA vocal et état du chat vocal."
version = "1.0.0"
id = "artifacts/maximegpt-activity-demo"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 19883

[services.development]
run = "pnpm --filter @workspace/maximegpt-activity-demo run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/maximegpt-activity-demo", "run", "build" ]
serve = "static"
publicDir = "artifacts/maximegpt-activity-demo/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "19883"
BASE_PATH = "/"
